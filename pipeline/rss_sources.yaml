# RSS 数据源配置
# enabled: true  → 参与每日采集
# enabled: false → 跳过（量太大或待确认可用性）

sources:
  # ── 综合技术 ──
  - name: Hacker News Best (AI)
    url: "https://hnrss.org/best?q=ai+OR+llm+OR+agent+OR+%22language+model%22+OR+%22artificial+intelligence%22"
    category: 综合技术
    enabled: true

  - name: Lobsters AI/ML
    url: "https://lobste.rs/t/ai.rss"
    category: 综合技术
    enabled: true

  # ── AI 研究 ──
  - name: arXiv cs.AI
    url: "https://rss.arxiv.org/rss/cs.AI"
    category: AI 研究
    enabled: false
    note: 每日发文量大，仅按需启用

  # ── 公司博客 ──
  - name: OpenAI Blog
    url: "https://openai.com/news/feed.xml"
    category: 公司博客
    enabled: true

  - name: Anthropic Research
    url: "https://www.anthropic.com/research/feed.xml"
    category: 公司博客
    enabled: true

  - name: Hugging Face Blog
    url: "https://huggingface.co/blog/feed.xml"
    category: 公司博客
    enabled: true

  # ── 中文社区 ──
  - name: 机器之心
    url: "https://www.jiqizhixin.com/rss"
    category: 中文社区
    enabled: false
    note: RSS 可用性待确认

  - name: 量子位
    url: "https://www.qbitai.com/feed/"
    category: 中文社区
    enabled: false
    note: RSS 可用性待确认
