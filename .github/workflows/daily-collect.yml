name: Daily Collect

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        id: pipeline
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python pipeline/pipeline.py --sources github,rss --limit 20 --verbose

      - name: Check for new articles
        id: check
        run: |
          CHANGES=$(git status --porcelain knowledge/articles/)
          if [ -z "$CHANGES" ]; then
            echo "No new articles, skipping commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            ARTICLE_COUNT=$(echo "$CHANGES" | wc -l)
            echo "Found $ARTICLE_COUNT new article(s)"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "article_count=$ARTICLE_COUNT" >> $GITHUB_OUTPUT
          fi

      - name: Validate JSON files
        if: steps.check.outputs.has_changes == 'true'
        run: python hooks/validate_json.py knowledge/articles/*.json

      - name: Check article quality
        if: steps.check.outputs.has_changes == 'true'
        run: python hooks/check_quality.py knowledge/articles/*.json

      - name: Commit and push
        if: steps.check.outputs.has_changes == 'true'
        run: |
          TODAY=$(date -u +'%Y-%m-%d')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add knowledge/articles/ knowledge/raw/
          git commit -m "chore: collect ${{ steps.check.outputs.article_count }} articles on $TODAY"
          git push
